name: Bug report / 问题反馈
description: 报告 PokeCall 问题（请先按 README「如何获取日志」抓日志）/ Report a PokeCall issue (please collect logs first, see README)
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: device
    attributes:
      label: 设备与系统 / Device & ROM
      description: 手机型号、系统版本（如 小米 17 Ultra，HyperOS 4 / Android 17）
      placeholder: 型号 + ROM + Android 版本
    validations:
      required: true
  - type: textarea
    id: lsposed
    attributes:
      label: LSPosed 信息 / LSPosed info
      description: 管理器版本号，是否开启详细日志（Settings → verbose logging）
      placeholder: 例如：LSPosed 1.9.2 (zygisk)，已开启详细日志
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 怎么触发的问题？来电？挂断？设置页？
      placeholder: |
        1. 
        2. 
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs（重要）
      description: 按 README「如何获取日志」抓取：LSPosed 日志页导出，或 adb logcat。把文件拖进来或粘贴文本。
      placeholder: 把 lspd 日志 / logcat 文件拖到这里，或粘贴日志内容
  - type: textarea
    id: media
    attributes:
      label: 截图 / 录屏 / Screenshots
      description: 界面问题请附截图或录屏，更直观
      placeholder: 把图片拖到这里
